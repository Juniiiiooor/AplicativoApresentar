services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      QUIZ_DATA_DIR: /app/data
      QUIZ_CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    volumes:
      - ./data:/app/data

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
